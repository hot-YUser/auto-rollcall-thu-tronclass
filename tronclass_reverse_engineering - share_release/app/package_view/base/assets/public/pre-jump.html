<html class=hydrated lang=en mode=ios><meta charset=UTF-8><meta content="width=device-width,initial-scale=1"name=viewport><meta charset=utf-8><meta content="IE=edge,chrome=1"http-equiv=X-UA-Compatible><meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"name=viewport><meta content="max-age=0"http-equiv=cache-control><meta content=no-cache http-equiv=cache-control><meta content=0 http-equiv=expires><meta content="Tue, 01 Jan 1980 1:00:00 GMT"http-equiv=expires><meta content=no-cache http-equiv=pragma><meta content=no name=mobile-web-app-capable><link href="<%= BASE_URL %>favicon.ico"rel=icon><style>*{margin:0;padding:0}.worm{display:flex;position:absolute;align-items:center;justify-content:center;color:#fff;width:100vw;height:100vh;background:linear-gradient(180deg,#00d4d6,#0784a0);transition:opacity 1s;opacity:1}.worm .load{width:20%;justify-content:space-around;align-items:center;display:flex;flex-direction:row;min-width:100px;max-width:400px}.worm .line{display:inline-block;width:15px;height:15px;border-radius:15px;background-color:rgba(255,255,255,.7)}.worm .load .line:nth-last-child(1){-webkit-animation:loading .6s .1s linear infinite;animation:loading .6s .1s linear infinite}.worm .load .line:nth-last-child(2){-webkit-animation:loading .6s .2s linear infinite;animation:loading .6s .2s linear infinite}.worm .load .line:nth-last-child(3){-webkit-animation:loading .6s .3s linear infinite;animation:loading .6s .3s linear infinite}.worm .load .line:nth-last-child(4){-webkit-animation:loading .6s .4s linear infinite;animation:loading .6s .4s linear infinite}.worm .load .line:nth-last-child(5){-webkit-animation:loading .6s .5s linear infinite;animation:loading .6s .5s linear infinite}@-webkit-keyframes loading{0%{-webkit-transform:translate(0,0);transform:translate(0,0)}50%{-webkit-transform:translate(0,15px);transform:translate(0,15px)}100%{-webkit-transform:translate(0,0);transform:translate(0,0)}}@keyframes loading{0%{-webkit-transform:translate(0,0);transform:translate(0,0)}50%{-webkit-transform:translate(0,15px);transform:translate(0,15px)}100%{-webkit-transform:translate(0,0);transform:translate(0,0)}}</style><body><noscript><strong>We're sorry but<%= htmlWebpackPlugin.options.title %>doesn't work properly without JavaScript enabled. Please enable it to continue.</strong></noscript><div class=worm><div class=load><div class=line></div><div class=line></div><div class=line></div><div class=line></div><div class=line></div></div></div><script>function jumpToHome(t){location.replace("/?v="+t)}function autoJump(){fetch(location.origin+"/.version?v="+Date.now().toString()).then(t=>200===t.status?t.text():"").then(t=>{var o=t?t.split("\n"):[];jumpToHome(o.length?o[2]:Date.now().toString())}).catch(()=>{jumpToHome(Date.now().toString())})}autoJump();</script>
