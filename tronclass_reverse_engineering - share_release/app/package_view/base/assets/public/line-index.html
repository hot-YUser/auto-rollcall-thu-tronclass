<!DOCTYPE html>
<html lang="en" mode="ios" class="hydrated">

<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0,minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <title>TronClass</title>
    <link rel="icon" href="./favicon.ico?v=1" />
    <style lang="css">
        * {
            margin: 0;
            padding: 0;
        }

        .worm {
            display: flex;
            position: absolute;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #00d4d6, #0784a0);
            transition: opacity 1s;
            opacity: 1;
        }

        .worm .load {
            width: 20%;
            justify-content: space-around;
            align-items: center;
            display: flex;
            flex-direction: row;
            min-width: 100px;
            max-width: 400px;
        }

        .worm .line {
            display: inline-block;
            width: 15px;
            height: 15px;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.7);
        }

        .worm .load .line:nth-last-child(1) {
            -webkit-animation: loading 0.6s 0.1s linear infinite;
            animation: loading 0.6s 0.1s linear infinite;
        }

        .worm .load .line:nth-last-child(2) {
            -webkit-animation: loading 0.6s 0.2s linear infinite;
            animation: loading 0.6s 0.2s linear infinite;
        }

        .worm .load .line:nth-last-child(3) {
            -webkit-animation: loading 0.6s 0.3s linear infinite;
            animation: loading 0.6s 0.3s linear infinite;
        }

        .worm .load .line:nth-last-child(4) {
            -webkit-animation: loading 0.6s 0.4s linear infinite;
            animation: loading 0.6s 0.4s linear infinite;
        }

        .worm .load .line:nth-last-child(5) {
            -webkit-animation: loading 0.6s 0.5s linear infinite;
            animation: loading 0.6s 0.5s linear infinite;
        }

        @-webkit-keyframes loading {
            0% {
                -webkit-transform: translate(0, 0);
                transform: translate(0, 0);
            }

            50% {
                -webkit-transform: translate(0, 15px);
                transform: translate(0, 15px);
            }

            100% {
                -webkit-transform: translate(0, 0);
                transform: translate(0, 0);
            }
        }

        @keyframes loading {
            0% {
                -webkit-transform: translate(0, 0);
                transform: translate(0, 0);
            }

            50% {
                -webkit-transform: translate(0, 15px);
                transform: translate(0, 15px);
            }

            100% {
                -webkit-transform: translate(0, 0);
                transform: translate(0, 0);
            }
        }
    </style>
    <script>
        function wgGetUrlParams() {
            return location.search.substring(1, location.search.length).split("&")
                .filter(function (pair) {
                    return pair.length;
                })
                .map(
                    function (pair) {
                        return pair.split("=");
                    }
                )
                .reduce(function (result, pair) {
                    result[pair[0]] = pair[1];
                    return result;
                }, {});
        }

        var wgUrlParams = wgGetUrlParams();
        var liffState = wgUrlParams["liff.state"];
        var liffStateObject;
        if (liffState) {
            try {
                liffStateObject = JSON.parse(decodeURIComponent(liffState));
            } catch {
                liffStateObject = null;
            }
        }
        if (liffStateObject) {
            location.replace(location.origin + liffStateObject.path + liffStateObject.params + location.hash);
        } else {
            location.replace(location.origin + location.search + location.hash);
        }
    </script>
</head>

<body>
    <noscript>
        <strong>We're sorry but TronClass doesn't work properly without
            JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="firstPaint" class="worm">
        <div class="load">
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </div>
</body>

</html>
