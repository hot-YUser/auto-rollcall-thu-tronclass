<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iClass學習平台</title>
  <style>
    /* Custom styles for image */
    .image-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 0px; /* Add padding to create space from top */
    }
    .image-container img {
      max-width: 100%;
      height: auto;
      max-height: 80vh;
      min-width: 300px;
    }
    .login-button {
      display: inline-block;
      width: 120px;
      padding: 10px 20px;
      background-color: #bb7404;
      color: #fff;
      border: none;
      border-radius: 20px; /* Rounded corners */
      cursor: pointer;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px; /* Adjust font size as needed */
      text-align: center; /* Center the text */
    }
    .login-button:hover {
      background-color: #640C02; /* Darker color on hover */
    }
  </style>
</head>
<body>
  <div>
    <div>
      <div>
        <div class="image-container">
          <a href="https://iclass.tku.edu.tw/login?next=/iportal&locale=zh_TW">
            <img src="https://tkutcmediatw.z40.web.core.windows.net/iclassbackgroud.jpg" alt="iClass學習平台">
          </a>
        </div>
        <br />
        <div class="image-container">
          <a href="https://iclass.tku.edu.tw/login?next=/iportal&locale=zh_TW" class="login-button">登入 / Login</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
