# Factory-default school registry — the SEED that fills config.advanced.toml on
# first run. After that, config.advanced.toml is the live, editable source of
# truth: edit / add / remove schools THERE, not here. Delete config.advanced.toml
# to re-seed everything from this file.
#
# Each [<key>] block — the key IS the school code (the config.conf `school` value):
#   label    = display name
#   base_url = site root; login URL / auth flow / image-captcha are all auto-detected
#              at runtime, so there is deliberately NO per-school login_url/auth_flow.
#   aliases  = extra names (中文/英文) that resolve to this code (optional)
#   notes    = informational only (optional)
# Capabilities are uniform for every school and applied in code, not listed here.

default = "thu"

[thu]
label = "Tunghai University iLearn"
base_url = "https://ilearn.thu.edu.tw"
aliases = ["東海", "東海大學", "tunghai", "ilearn", "ilearn.thu", "thu.edu"]
notes = "Primary supported provider. Kept compatible with the legacy config.conf flow."

[fju]
label = "Fu Jen Catholic University TronClass"
base_url = "https://elearn2.fju.edu.tw"
aliases = ["輔仁", "輔仁大學", "fju.edu"]
notes = "CAS login with a static numeric image captcha, solved locally via the 'ocr' extra (ddddocr) or the downloadable OCR sidecar."

