name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # 完整 commit SHA 鎖版（供應鏈可重現）；標籤見行尾註解。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Lint (ruff)
        # Fail fast on lint before the heavier install + test steps.
        # Keep this pin in sync with pyproject.toml [project.optional-dependencies].dev.
        run: |
          python -m pip install "ruff==0.15.20"
          python -m ruff check troTHU tests

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Targeted smoke tests
        run: python -m unittest -v tests.test_local_surfaces tests.test_release tests.test_cli tests.test_contracts

      - name: Release checklist smoke
        run: python -m troTHU.tron release-check --json

      - name: Release build dry run
        run: python -m troTHU.tron release-build --dry-run --json

      - name: Full unittest suite
        run: python -m unittest discover -v
